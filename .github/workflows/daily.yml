name: Daily Differential Edition

on:
  schedule:
    - cron: '30 6,18 * * *' # Runs twice daily at 6:30 AM UTC (12:00 PM IST) and 6:30 PM UTC (12:00 AM IST)
  workflow_dispatch:     # Allows manual triggering from the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  Fetch-and-Build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Fetch today's edition
        run: |
          python scripts/fetch_news.py

      - name: Save the new edition
        run: |
          git config --local user.name "daily-differential-bot"
          git config --local user.email "daily-differential-bot@users.noreply.github.com"
          git add docs/data/
          if git diff --cached --quiet; then
            echo "No new edition changes to commit."
          else
            git commit -m "chore: edition for $(date -u +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}" || (git rebase --abort && git reset --soft HEAD~1 && git pull --rebase origin "${GITHUB_REF_NAME}" && git commit -m "chore: edition for $(date -u +%F)")
            git push origin "${GITHUB_REF_NAME}"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

  Publish-to-GitHub-Pages:
    needs: Fetch-and-Build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
